# Zorin OS 17 Core test VM for .deb install testing.
#
# Notes vs the original spec:
# - The image is "qemux/qemu" (Docker Hub). "qemux/qemu-docker" does not exist
#   as an image; that is the name of the GitHub repo (qemus/qemu-docker).
# - The ISO is bind-mounted to /boot.iso, which qemu-docker's findBootFile()
#   detects; its presence makes the BOOT env var moot, so BOOT is not set.
#   If /boot.iso is ever removed, set BOOT to any ISO URL or distro name
#   (upstream default is "alpine").
services:
  zorin-vm:
    image: qemux/qemu
    container_name: zorin-os
    environment:
      RAM_SIZE: "4G"
      CPU_CORES: "4"
      DISK_SIZE: "32G"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006" # Web-based VNC/noVNC viewer
    volumes:
      - ../../target/testbed/zorin_storage:/storage
      # Must NOT be :ro — QEMU attaches the media via usb-storage with
      # removable=on, which opens the file read-write; a :ro bind fails with
      # "Could not open '/boot.iso': Read-only file system" and crashloops.
      - ../../target/testbed/iso/Zorin-OS-17.3-Core-64-bit-r2.iso:/boot.iso
    restart: unless-stopped
    # Give the VM time to receive the ACPI shutdown signal before it is killed.
    stop_grace_period: 2m

  # Additional distro flavors for the .deb target matrix (see README.md).
  # Each service sits behind its own compose profile, so a bare
  # `docker compose up -d` still starts only zorin-vm; start a flavor with
  # `docker compose --profile <name> up -d <service>`.
  # Definitions mirror zorin-vm exactly (image, sizing, devices, caps,
  # storage layout, grace period) — only the ISO, host noVNC port, container
  # name, and storage dir differ.

  zorin-lite-vm:
    image: qemux/qemu
    container_name: zorin-lite-os
