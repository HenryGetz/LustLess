    volumes:
      - ../../target/testbed/zorin_lite_storage:/storage
      # Must NOT be :ro — QEMU attaches the media via usb-storage with
      # removable=on; a :ro bind fails and crashloops (see zorin-vm above).
      - ../../target/testbed/iso/Zorin-OS-17.3-Lite-64-bit-r2.iso:/boot.iso
    restart: unless-stopped
    # Give the VM time to receive the ACPI shutdown signal before it is killed.
    stop_grace_period: 2m

  xubuntu-vm:
