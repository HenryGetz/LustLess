[package]
name = "lustless-agent"
version = "0.1.0"
edition = "2021"
description = "LustLess per-session tray: GTK3 + libayatana-appindicator status icon and menu (docs/impl/CONTRACTS.md §13)"
license = "Apache-2.0"

[[bin]]
name = "lustless-agent"
path = "src/main.rs"

[dependencies]
lustless-core = { path = "../lustless-core" }

serde_json.workspace = true
tracing.workspace = true

# Logging to stderr → journald via the user unit (CONTRACTS §14 shape).
tracing-subscriber = "=0.3.23"

# GTK3 tray + menu (CONTRACTS §2 pin: gtk 0.18). The `libappindicator` crate
# (0.9) dlopens `libayatana-appindicator3.so.1` at runtime with a
# `libappindicator3.so.1` fallback, so the build needs no appindicator -dev
# package and the packaged binary uses the ayatana library of §15 Depends.
gtk = { version = "=0.18.2", features = ["v3_24"] }
libappindicator = "=0.9.0"

# D-Bus client for the desktop notification spec endpoint
# (`org.freedesktop.Notifications`, the service libnotify talks to), the
# StatusNotifierWatcher presence probe that drives the no-SNI graceful
# degradation (§13), and the Secret Service token store (§13 libsecret).
zbus = { version = "=5.19.0", default-features = false, features = ["tokio", "blocking-api"] }

[dev-dependencies]
tempfile = "3.27.0"
