[package]
name = "lustless-classifier"
version = "0.1.9"
edition = "2021"
description = "LustLess screenstate classifier: spool consumer, CE ensemble scoring engine, bundle manager"
license = "Apache-2.0"

[[bin]]
name = "lustless-classifier"
path = "src/main.rs"

[dependencies]
lustless-core = { path = "../lustless-core" }
lustless-capture = { path = "../lustless-capture", default-features = false }

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true

# AES-256-CBC + PKCS#7 decryption of the CE bundle artifacts (bundle-formats.md
# §1: context-0 key + fixed IV, no MAC). RustCrypto, no OpenSSL.
aes = "=0.8.4"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }

# Deterministic CPU inference: parallelism over conv output channels and
# support-vector rows only (reduction order fixed per element ⇒ reproducible).
rayon = "=1.10.0"

# Snowball English stemmer for the window-title feature extractor — the same
# libstemmer algorithm CE embeds (`sb_stemmer_new("english")`).
rust-stemmers = "=1.2.0"

# PNG decoding of the spool images + crops for the scorer.
image = { version = "0.25.10", default-features = false, features = ["png"] }

# SIGTERM/SIGINT handler for the supervision lifecycle (CONTRACTS §7).
libc = "0.2.190"

# `<pid>.log` timestamps + protocol `ts` stamps (CONTRACTS §14).
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
