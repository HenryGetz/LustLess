[package]
name = "lustlessctl"
version = "0.1.9"
edition = "2021"
description = "LustLess admin/diagnostics CLI: UDS client for the lustlessd IPC (docs/impl/CONTRACTS.md §5)"
license = "Apache-2.0"

[[bin]]
name = "lustlessctl"
path = "src/main.rs"

[dependencies]
lustless-core = { path = "../lustless-core" }

serde_json.workspace = true
toml.workspace = true

# Password input without echo for `signin` (CONTRACTS §5 0x65):
# `nix::sys::termios` behind the `term` feature.
nix = { version = "=0.30.1", features = ["term"] }

[dev-dependencies]
tempfile = "3.27.0"
